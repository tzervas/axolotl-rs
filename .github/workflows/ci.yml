# Centralized CI — calls tzervas/mycelium-workflows for the core gate.
#
# PIN: @v1 is a moving major tag. Minor/patch policy changes arrive automatically;
# a breaking change lands on v2 and this file must opt in.
#
# WHAT MOVED AND WHAT DID NOT
#
#   moved to the reusable workflow:  fmt, clippy, cargo check, cargo test, docs,
#                                    benchmarks
#   kept here, untouched:            coverage (llvm-cov + Codecov), security
#                                    (cargo-audit + cargo-deny), MSRV (1.92)
#
# The reusable workflow has no equivalent for coverage, cargo-audit/cargo-deny or
# an MSRV pin, so those jobs stay exactly as they were. Centralizing must not cost
# a gate.
#
# The clippy allow-list is carried across VERBATIM via clippy-extra-args. The
# centralized default is a bare `-D warnings`, which is STRICTER than this repo's
# current bar; adopting it silently here would break the build on lints this repo
# has deliberately deferred. Tighten it in a separate, visible PR instead.
#
# Sister-project deps must be patched before cargo can resolve at all, so
# setup-command runs .github/scripts/patch-dependencies.sh, with the three ref
# overrides passed through setup-env.
#
# DROPPED DELIBERATELY: the PR-body override markers ("peft-rs: <ref>" in a pull
# request description). Interpolating a pull request body — which anyone opening a
# PR controls — into a workflow environment is a script-injection channel. The
# workflow_dispatch inputs remain and cover the same need for maintainers.
name: CI

on:
  push:
    branches: [main, dev, 'ci/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      peft_rs_ref:
        description: 'peft-rs git ref (branch, tag, or commit SHA)'
        required: false
        default: 'main'
      qlora_rs_ref:
        description: 'qlora-rs git ref (branch, tag, or commit SHA)'
        required: false
        default: 'main'
      unsloth_rs_ref:
        description: 'unsloth-rs git ref (branch, tag, or commit SHA)'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    # Name kept: "Test Suite" is what reviewers and any future ruleset look for.
    name: Test Suite
    uses: tzervas/mycelium-workflows/.github/workflows/reusable-rust-ci.yml@v1
    with:
      rust-version: stable
      depth: >-
        ${{ (github.base_ref || github.ref_name) == 'main' && 'full' || 'check+test' }}
      # This repo has always gated on GitHub-hosted runners. peft-rs measured the
      # self-hosted fleet OOM-killing candle-core/pulp builds even at
      # CARGO_BUILD_JOBS=1, and axolotl-rs pulls the same dependency graph — so the
      # main tier stays on ubuntu-latest rather than inheriting the fleet default.
      # This is a reliability choice about WHERE the gate runs, not a weaker gate.
      runner-labels: '["ubuntu-latest"]'
      setup-command: 'bash .github/scripts/patch-dependencies.sh'
      setup-env: |
        PEFT_RS_REF=${{ github.event.inputs.peft_rs_ref || 'main' }}
        QLORA_RS_REF=${{ github.event.inputs.qlora_rs_ref || 'main' }}
        UNSLOTH_RS_REF=${{ github.event.inputs.unsloth_rs_ref || 'main' }}
      # Carried across verbatim from the previous inline clippy invocation.
      clippy-extra-args: >-
        -A clippy::cast_precision_loss -A clippy::cast_possible_truncation
        -A clippy::cast_sign_loss -A clippy::missing_errors_doc
        -A clippy::missing_panics_doc -A clippy::too_many_lines
        -A clippy::ptr_arg -A clippy::zero_sized_map_values
        -A clippy::unnecessary_wraps -A clippy::match_same_arms
        -A clippy::no_effect_underscore_binding
        -A clippy::unnecessary_debug_formatting -A clippy::unused_self
      # Previously `cargo bench --bench config_parsing --no-run` on PRs only —
      # benches that merely COMPILE. The main tier now runs them to completion.
      bench: >-
        ${{ (github.base_ref || github.ref_name) == 'main' && 'run' || 'compile' }}
      bench-args: '--bench config_parsing'

  test-beta:
    # Preserves the previous matrix cell `rust: beta`, which was a hard gate (the
    # old matrix set no fail-fast/continue-on-error escape), so it stays one.
    # `continue-on-error` is not even available on a job that `uses:` a reusable
    # workflow, so softening it here would require moving it back inline.
    name: Test Suite (beta)
    uses: tzervas/mycelium-workflows/.github/workflows/reusable-rust-ci.yml@v1
    with:
      rust-version: beta
      depth: check+test
      runner-labels: '["ubuntu-latest"]'
      setup-command: 'bash .github/scripts/patch-dependencies.sh'
      setup-env: |
        PEFT_RS_REF=${{ github.event.inputs.peft_rs_ref || 'main' }}
        QLORA_RS_REF=${{ github.event.inputs.qlora_rs_ref || 'main' }}
        UNSLOTH_RS_REF=${{ github.event.inputs.unsloth_rs_ref || 'main' }}
      clippy-extra-args: >-
        -A clippy::cast_precision_loss -A clippy::cast_possible_truncation
        -A clippy::cast_sign_loss -A clippy::missing_errors_doc
        -A clippy::missing_panics_doc -A clippy::too_many_lines
        -A clippy::ptr_arg -A clippy::zero_sized_map_values
        -A clippy::unnecessary_wraps -A clippy::match_same_arms
        -A clippy::no_effect_underscore_binding
        -A clippy::unnecessary_debug_formatting -A clippy::unused_self
      bench: 'off'

  coverage:
    # Untouched. The reusable workflow has no coverage equivalent.
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Patch sister project dependencies
        run: bash .github/scripts/patch-dependencies.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Fetch dependencies (including sister projects)
        run: cargo fetch
        continue-on-error: true
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.62.33
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    # Untouched. cargo-audit and cargo-deny have no reusable equivalent.
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Patch sister project dependencies
        run: bash .github/scripts/patch-dependencies.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies (including sister projects)
        run: cargo fetch
        continue-on-error: true
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check

  msrv:
    # Untouched. The reusable workflow pins one toolchain; an MSRV floor check is
    # a separate assertion and stays here.
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Patch sister project dependencies
        run: bash .github/scripts/patch-dependencies.sh

      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"

      - name: Fetch dependencies (including sister projects)
        run: cargo fetch
        continue-on-error: true
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true

      - name: Check MSRV
        run: cargo check
