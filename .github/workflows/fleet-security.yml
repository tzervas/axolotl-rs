# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: fleet-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --verbose --redact
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source=/path --verbose --redact
          elif command -v podman >/dev/null 2>&1; then
            podman run --rm -v "$PWD:/path:ro" docker.io/zricethezav/gitleaks:latest detect --source=/path --verbose --redact
          else
            echo "gitleaks, docker, and podman are not pre-installed. Attempting to download gitleaks securely..."
            arch=$(uname -m)
            if [ "$arch" = "x86_64" ]; then
              gitleaks_arch="x64"
            elif [ "$arch" = "aarch64" ]; then
              gitleaks_arch="arm64"
            else
              gitleaks_arch="x64"
            fi
            echo "Detected architecture: $arch -> downloading gitleaks for $gitleaks_arch"
            gitleaks_file="gitleaks_8.18.2_linux_${gitleaks_arch}.tar.gz"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/${gitleaks_file}" -o "${gitleaks_file}"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_checksums.txt" -o checksums.txt
            grep "${gitleaks_file}" checksums.txt | sha256sum -c -
            tar -xzf "${gitleaks_file}" gitleaks
            ./gitleaks detect --source . --verbose --redact
          fi

  trivy-fs:
    name: trivy filesystem (vuln+secret+license)
    runs-on: [self-hosted, linux, x64, podman]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            echo "trivy missing — advisory skip (continue-on-error)"
            exit 0
          fi
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
