# Fleet CI. Detect is GitHub-hosted (file-existence only) so the GPU
# kitchen-sink job is not stuck behind the homelab CPU queue.
#
# Kitchen-sink rustc does **not** run there. axolotl-rs depends on
# candle-transformers 0.11 with no per-model features (~49k LOC). rustc
# SIGKILL (signal 9) on that crate on the homelab podman runner is OOM, not a
# flake (CGU=1 / CARGO_BUILD_JOBS=1 still died 2026-08-21).
#
# Product cargo check/test for this workflow runs on **akula-prime** (5080
# desktop) via gha-runner-ctl GPU jobs (`gpu`). The retain worker is 16 GiB.
# `gpu` is **routing to that host**, not enabling candle CUDA (default
# features only). Do not add `large`: the GPU runner is not registered with
# that label, so GitHub would queue forever. Benches stay on hosted ci.yml.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

# One kitchen-sink compile for this repo at a time. Queue rather than cancel
# so a main push does not wipe a PR gate (and so two rustc's do not share the
# GPU worker's 16 GiB).
concurrency:
  group: axolotl-rs-fleet-ci
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  detect:
    name: detect stack
    # Cheap file-existence probe. Do not queue this behind homelab CPU
    # (that blocked the GPU kitchen-sink job for tens of minutes).
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          if [ -f Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  # Homelab CPU runner: do not rustc candle-transformers.
  runner-health:
    name: self-hosted memory (no kitchen-sink rustc)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman, rust]
    timeout-minutes: 10
    steps:
      - name: memory snapshot and OOM policy
        run: |
          set -euo pipefail
          free -h || true
          nproc || true
          echo "HONEST_CI class=OOM_SKIP detail=candle-transformers_0.11"
          echo "This runner SIGKILL'd rustc compiling candle-transformers 0.11"
          echo "even with CARGO_BUILD_JOBS=1 and codegen-units=1."
          echo "Kitchen-sink cargo check/test is the GPU-host job below"
          echo "(label gpu — RAM routing, not CUDA) plus ci.yml Test Suite."

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    # akula-prime 5080 (gha-runner-ctl GPU job). Homelab CPU SIGKILL/OOM.
    # `gpu` selects that host; this job does not enable candle CUDA.
    # Do not add `large`: that label is not on the registered GPU runner.
    runs-on: [self-hosted, linux, x64, podman, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prefer rustup 1.96.1 over image rustc
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: free memory snapshot
        run: |
          set -euo pipefail
          free -h || true
          nproc || true
          echo "HONEST_CI class=GPU_RAM_ROUTE detail=not_cuda"
      - name: cargo check
        # Do not --all-targets: benches pull criterion/plotters (hosted ci.yml).
        run: cargo check --workspace --lib --bins --tests
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"
          enable-cache: true
      - name: Sync (best-effort)
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups 2>/dev/null || uv sync 2>/dev/null || true
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            uv run pytest -q 2>/dev/null || pytest -q 2>/dev/null || echo "pytest failed or missing — mark job fail" >&2
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
