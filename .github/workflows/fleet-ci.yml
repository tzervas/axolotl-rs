# Fleet standard CI — self-hosted. Honest status on trunk via Actions badge.
# See docs/FLEET_STANDARDS.md.
#
# This job is the kitchen-sink compile: axolotl-rs depends on candle-transformers
# 0.11, which has no model feature flags (~49k LOC, every architecture). rustc
# SIGKILL (signal 9) on that crate is OOM, not a flake.
#
# Evidence (2026-08-21): two fleet-ci runs on different refs
# (release/1.4.0 PR + main push) compiled candle-transformers concurrently
# and both died at the same second. Per-ref concurrency groups allowed that.
# Default profile.dev codegen-units=256 also inflates a single rustc's RSS.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

# One rustc tree for this repo at a time (PR and trunk must not overlap).
# Queue rather than cancel so a main push does not wipe an in-flight PR gate.
concurrency:
  group: axolotl-rs-fleet-ci
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Self-hosted podman runners: one rustc, no incremental, no debuginfo.
  # Match peft-rs RUSTFLAGS so candle-transformers does not compile at
  # profile.dev's default 256 codegen-units.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "1"
  RUSTFLAGS: "-C codegen-units=1 -C debuginfo=0"
  # Tests allocate Candle tensors; keep one harness thread on this runner.
  RUST_TEST_THREADS: "1"

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman]
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          if [ -f Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Work image ships rustc 1.88; this crate's MSRV is 1.96.
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prefer rustup 1.96.1 over image rustc 1.88
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: free memory snapshot
        run: |
          set -euo pipefail
          free -h || true
          nproc || true
          echo "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-}"
          echo "CARGO_PROFILE_DEV_CODEGEN_UNITS=${CARGO_PROFILE_DEV_CODEGEN_UNITS:-}"
          echo "RUSTFLAGS=${RUSTFLAGS:-}"
      - name: cargo check
        # Do not --all-targets: benches pull criterion/plotters and are gated
        # on GitHub-hosted CI. Lib + bin + tests still compile candle-transformers
        # (required) at 1 codegen-unit.
        run: cargo check --workspace --lib --bins --tests
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Sync (best-effort)
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups 2>/dev/null || uv sync 2>/dev/null || true
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            uv run pytest -q 2>/dev/null || pytest -q 2>/dev/null || echo "pytest failed or missing — mark job fail" >&2
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
